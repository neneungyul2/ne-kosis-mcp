[project]
name = "ne-kosis-mcp"
version = "0.1.0"
description = "KOSIS (Korean Statistical Information Service) OpenAPI MCP server: table finder, data, trend analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "tzdata; sys_platform == 'win32'",
]

[project.scripts]
ne-kosis-mcp = "ne_kosis_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ne_kosis_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real KOSIS OpenAPI (set KOSIS_LIVE_TEST=1)"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.py" },
  { file = "src/ne_kosis_mcp/data/**" },
]
